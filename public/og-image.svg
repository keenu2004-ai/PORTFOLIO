<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#090a0f"/>
  
  <!-- Ambient Gradients -->
  <circle cx="200" cy="150" r="300" fill="#00f0ff" opacity="0.1" filter="blur(60px)"/>
  <circle cx="1000" cy="500" r="350" fill="#7000ff" opacity="0.12" filter="blur(70px)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300 M 0 400 L 1200 400 M 0 500 L 1200 500" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M 200 0 L 200 630 M 400 0 L 400 630 M 600 0 L 600 630 M 800 0 L 800 630 M 1000 0 L 1000 630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  
  <!-- Border Card Frame -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#0d0e15" stroke="#1f2438" stroke-width="2"/>
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="none" stroke="#00f0ff" stroke-opacity="0.2" stroke-width="1"/>
  
  <!-- Content -->
  <!-- Tag -->
  <rect x="120" y="130" width="230" height="36" rx="18" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-opacity="0.3"/>
  <text x="140" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#00f0ff" letter-spacing="2">FULL-STACK &amp; IOT ENGINEER</text>
  
  <!-- Main Title -->
  <text x="120" y="240" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">Vaibhav Rajput</text>
  
  <!-- Subtitle / Role -->
  <text x="120" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#8f9bb3">Engineering Enterprise Software &amp; Smart Hardware Systems</text>
  
  <!-- Tech Stack Chips -->
  <g transform="translate(120, 360)">
    <rect x="0" y="0" width="100" height="40" rx="8" fill="#151928" stroke="#2a324b"/><text x="50" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#00f0ff">React</text>
    <rect x="115" y="0" width="130" height="40" rx="8" fill="#151928" stroke="#2a324b"/><text x="180" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#00f0ff">TypeScript</text>
    <rect x="260" y="0" width="110" height="40" rx="8" fill="#151928" stroke="#2a324b"/><text x="315" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#a855f7">Node.js</text>
    <rect x="385" y="0" width="130" height="40" rx="8" fill="#151928" stroke="#2a324b"/><text x="450" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#a855f7">PostgreSQL</text>
    <rect x="530" y="0" width="100" height="40" rx="8" fill="#151928" stroke="#2a324b"/><text x="580" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#22c55e">ESP8266</text>
    <rect x="645" y="0" width="100" height="40" rx="8" fill="#151928" stroke="#2a324b"/><text x="695" y="25" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="600" fill="#22c55e">Docker</text>
