services:
  portfolio-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      - PORT=3001
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL}
      - CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL}
    networks:
      - portfolio-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  portfolio-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:3000:80"
    networks:
      - portfolio-net
    depends_on:
      portfolio-api:
        condition: service_healthy
    restart: unless-stopped

networks:
  portfolio-net:
    driver: bridge
