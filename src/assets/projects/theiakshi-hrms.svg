  <!-- Sidebar -->
  <rect x="0" y="0" width="220" height="675" fill="#0d1117" stroke="#1f293d" stroke-width="1"/>
  <text x="24" y="45" fill="#00f0ff" font-family="monospace" font-size="18" font-weight="bold">THEIAKSHI-ONE</text>
  <text x="24" y="65" fill="#8b949e" font-family="sans-serif" font-size="11">ENTERPRISE HRMS</text>
  
  <!-- Nav Items -->
  <rect x="16" y="100" width="188" height="38" rx="6" fill="#00f0ff" fill-opacity="0.15" stroke="#00f0ff" stroke-width="1"/>
  <text x="44" y="124" fill="#00f0ff" font-family="sans-serif" font-size="13" font-weight="bold">📊 Dashboard</text>
  
  <text x="44" y="174" fill="#8b949e" font-family="sans-serif" font-size="13">👥 Employees</text>
  <text x="44" y="214" fill="#8b949e" font-family="sans-serif" font-size="13">⏱️ Attendance</text>
  <text x="44" y="254" fill="#8b949e" font-family="sans-serif" font-size="13">📅 Leave Engine</text>
  <text x="44" y="294" fill="#8b949e" font-family="sans-serif" font-size="13">⚙️ Regularization</text>
  <text x="44" y="334" fill="#8b949e" font-family="sans-serif" font-size="13">🔒 RBAC Roles</text>
  
