    <text x="40" y="78" fill="#8b949e" font-family="monospace" font-size="11">EMP ID</text>
    <text x="140" y="78" fill="#8b949e" font-family="monospace" font-size="11">EMPLOYEE NAME</text>
    <text x="320" y="78" fill="#8b949e" font-family="monospace" font-size="11">TYPE</text>
    <text x="450" y="78" fill="#8b949e" font-family="monospace" font-size="11">DATE RANGE</text>
    <text x="630" y="78" fill="#8b949e" font-family="monospace" font-size="11">REASON</text>
    <text x="790" y="78" fill="#8b949e" font-family="monospace" font-size="11">STATUS</text>

    <!-- Row 1 -->
    <line x1="24" y1="135" x2="896" y2="135" stroke="#21262d" stroke-width="1"/>
    <text x="40" y="118" fill="#00f0ff" font-family="monospace" font-size="12">EMP-0412</text>
    <text x="140" y="118" fill="#ffffff" font-family="sans-serif" font-size="12">Rahul Verma</text>
    <text x="320" y="118" fill="#e3b341" font-family="sans-serif" font-size="12">Attendance Regularization</text>
    <text x="450" y="118" fill="#8b949e" font-family="sans-serif" font-size="12">2026-08-24 (Biometric Miss)</text>
    <text x="630" y="118" fill="#8b949e" font-family="sans-serif" font-size="12">On-site client deployment</text>
    <rect x="790" y="102" width="80" height="22" rx="11" fill="#238636" fill-opacity="0.3" stroke="#2ea043" stroke-width="1"/>
    <text x="806" y="117" fill="#3fb950" font-family="sans-serif" font-size="11" font-weight="bold">APPROVED</text>

    <!-- Row 2 -->
    <line x1="24" y1="180" x2="896" y2="180" stroke="#21262d" stroke-width="1"/>
    <text x="40" y="163" fill="#00f0ff" font-family="monospace" font-size="12">EMP-0891</text>
    <text x="140" y="163" fill="#ffffff" font-family="sans-serif" font-size="12">Ananya Sharma</text>
    <text x="320" y="163" fill="#a5d6ff" font-family="sans-serif" font-size="12">Earned Leave Rollover</text>
    <text x="450" y="163" fill="#8b949e" font-family="sans-serif" font-size="12">2026-08-28 to 2026-09-02</text>
    <text x="630" y="163" fill="#8b949e" font-family="sans-serif" font-size="12">Annual Vacation</text>
    <rect x="790" y="147" width="80" height="22" rx="11" fill="#9e6a03" fill-opacity="0.3" stroke="#d29922" stroke-width="1"/>
    <text x="808" y="162" fill="#d29922" font-family="sans-serif" font-size="11" font-weight="bold">PENDING</text>

    <!-- Row 3 -->
    <line x1="24" y1="225" x2="896" y2="225" stroke="#21262d" stroke-width="1"/>
    <text x="40" y="208" fill="#00f0ff" font-family="monospace" font-size="12">EMP-0104</text>
    <text x="140" y="208" fill="#ffffff" font-family="sans-serif" font-size="12">Vikram Singh</text>
    <text x="320" y="208" fill="#f85149" font-family="sans-serif" font-size="12">Sick Leave Request</text>
    <text x="450" y="208" fill="#8b949e" font-family="sans-serif" font-size="12">2026-08-25</text>
    <text x="630" y="208" fill="#8b949e" font-family="sans-serif" font-size="12">Medical Emergency</text>
    <rect x="790" y="192" width="80" height="22" rx="11" fill="#238636" fill-opacity="0.3" stroke="#2ea043" stroke-width="1"/>
    <text x="806" y="207" fill="#3fb950" font-family="sans-serif" font-size="11" font-weight="bold">APPROVED</text>
