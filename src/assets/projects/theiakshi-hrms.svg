    <text x="20" y="70" fill="#ffffff" font-family="monospace" font-size="32" font-weight="bold">1,482</text>
    <text x="120" y="70" fill="#3fb950" font-family="sans-serif" font-size="12">+12% vs last month</text>
    
    <!-- Card 2 -->
    <rect x="235" y="0" width="215" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="255" y="32" fill="#8b949e" font-family="sans-serif" font-size="12">Attendance Today</text>
    <text x="255" y="70" fill="#00f0ff" font-family="monospace" font-size="32" font-weight="bold">96.4%</text>
    <text x="365" y="70" fill="#8b949e" font-family="sans-serif" font-size="12">1,429 Checked In</text>

    <!-- Card 3 -->
    <rect x="470" y="0" width="215" height="110" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="490" y="32" fill="#8b949e" font-family="sans-serif" font-size="12">Pending Leave Requests</text>
    <text x="490" y="70" fill="#d29922" font-family="monospace" font-size="32" font-weight="bold">18</text>
    <text x="545" y="70" fill="#d29922" font-family="sans-serif" font-size="12">Requires Action</text>

    <!-- Card 4 -->
    <rect x="705" y="0" width="215" height="110" rx="8" fill="#161b22" stroke="#00f0ff" stroke-width="1"/>
