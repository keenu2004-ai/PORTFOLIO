<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <!-- PhonePe Theme Purple Background -->
  <rect width="1200" height="675" fill="#130b24"/>
  <rect width="1200" height="675" fill="none" stroke="#673ab7" stroke-width="2" opacity="0.5"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#1f113a" stroke="#331c5f" stroke-width="1"/>
  <text x="50" y="45" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="24" font-weight="900">PhonePe</text>
  <rect x="175" y="24" width="220" height="24" rx="4" fill="#673ab7" fill-opacity="0.3" stroke="#9c27b0" stroke-width="1"/>
  <text x="185" y="40" fill="#d1c4e9" font-family="monospace" font-size="10" font-weight="bold">UNOFFICIAL EDUCATIONAL RECREATION</text>

  <!-- Navigation items -->
  <text x="620" y="42" fill="#ffffff" font-family="sans-serif" font-size="13">INSURANCE</text>
  <text x="730" y="42" fill="#ffffff" font-family="sans-serif" font-size="13">INVESTMENTS</text>
  <text x="850" y="42" fill="#ffffff" font-family="sans-serif" font-size="13">RECHARGE &amp; BILLS</text>
  <text x="1000" y="42" fill="#ffffff" font-family="sans-serif" font-size="13">SOUNDBOX</text>

  <!-- Interactive Phone Preview Mockup -->
  <g transform="translate(60, 100)">
    <!-- Phone Container -->
    <rect x="0" y="0" width="280" height="530" rx="30" fill="#090514" stroke="#673ab7" stroke-width="3"/>
    <rect x="100" y="12" width="80" height="12" rx="6" fill="#1f113a"/>
    
    <!-- Phone Screen Content -->
    <rect x="12" y="35" width="256" height="480" rx="20" fill="#1b1130"/>
    
    <!-- Phone Header -->
    <rect x="24" y="55" width="40" height="40" rx="20" fill="#673ab7"/>
    <text x="36" y="80" fill="#ffffff" font-family="sans-serif" font-size="18" font-weight="bold">V</text>
    <text x="75" y="70" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Vaibhav Rajput</text>
    <text x="75" y="86" fill="#b39ddb" font-family="monospace" font-size="10">@ybl • SBI Bank</text>

    <!-- Money Transfer Grid -->
    <rect x="24" y="110" width="232" height="100" rx="10" fill="#291849"/>
    <text x="36" y="130" fill="#d1c4e9" font-family="sans-serif" font-size="11" font-weight="bold">TRANSFER MONEY</text>
    <g transform="translate(36, 145)">
      <circle cx="20" cy="20" r="18" fill="#673ab7"/>
      <text x="12" y="25" fill="#fff" font-size="14">📱</text>
      <text x="4" y="48" fill="#fff" font-size="9">To Mobile</text>

      <circle cx="80" cy="20" r="18" fill="#673ab7"/>
      <text x="72" y="25" fill="#fff" font-size="14">🏦</text>
      <text x="62" y="48" fill="#fff" font-size="9">To Bank</text>

      <circle cx="140" cy="20" r="18" fill="#673ab7"/>
      <text x="132" y="25" fill="#fff" font-size="14">👤</text>
      <text x="126" y="48" fill="#fff" font-size="9">To Self</text>

      <circle cx="195" cy="20" r="18" fill="#673ab7"/>
      <text x="187" y="25" fill="#fff" font-size="14">💳</text>
      <text x="180" y="48" fill="#fff" font-size="9">Check Bal</text>
    </g>

    <!-- Phone Soundbox & SIP Simulation Card -->
    <rect x="24" y="225" width="232" height="85" rx="10" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-width="1"/>
    <text x="36" y="245" fill="#00f0ff" font-family="sans-serif" font-size="11" font-weight="bold">🔊 Web Speech Soundbox</text>
    <text x="36" y="265" fill="#ffffff" font-family="sans-serif" font-size="10">"PhonePe par ₹500 praapt hue!"</text>
    <rect x="36" y="275" width="160" height="22" rx="4" fill="#00f0ff"/>
    <text x="50" y="290" fill="#000" font-family="sans-serif" font-size="10" font-weight="bold">PLAY SOUND SIMULATION</text>
  </g>

  <!-- Right Section: Desktop React Features -->
  <g transform="translate(380, 100)">
    <rect x="0" y="0" width="760" height="530" rx="12" fill="#1a0f30" stroke="#3d226d" stroke-width="1"/>
    <text x="40" y="50" fill="#00f0ff" font-family="monospace" font-size="14" letter-spacing="2">REACT + VITE HIGH-FIDELITY WEB APPARATUS</text>
    <text x="40" y="95" fill="#ffffff" font-family="'Poppins', sans-serif" font-size="32" font-weight="900">Pixel-Perfect FinTech Interface</text>

    <!-- SIP Calculator Simulation Box -->
    <rect x="40" y="130" width="330" height="350" rx="8" fill="#120a22" stroke="#4a2a82" stroke-width="1"/>
    <text x="60" y="165" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">📈 SIP Investment Calculator</text>

    <text x="60" y="200" fill="#b39ddb" font-family="sans-serif" font-size="12">Monthly Investment: ₹10,000</text>
    <rect x="60" y="210" width="290" height="6" rx="3" fill="#673ab7"/>
    <rect x="60" y="210" width="180" height="6" rx="3" fill="#00f0ff"/>

    <text x="60" y="250" fill="#b39ddb" font-family="sans-serif" font-size="12">Expected Return Rate: 12% p.a.</text>
    <rect x="60" y="260" width="290" height="6" rx="3" fill="#673ab7"/>
    <rect x="60" y="260" width="220" height="6" rx="3" fill="#00f0ff"/>

    <text x="60" y="300" fill="#b39ddb" font-family="sans-serif" font-size="12">Time Period: 10 Years</text>
    
    <rect x="60" y="330" width="290" height="120" rx="6" fill="#1e1138"/>
    <text x="75" y="360" fill="#8b949e" font-family="sans-serif" font-size="11">Total Invested: ₹12,00,000</text>
    <text x="75" y="390" fill="#3fb950" font-family="sans-serif" font-size="11">Est. Returns: ₹11,23,391</text>
    <text x="75" y="425" fill="#00f0ff" font-family="monospace" font-size="18" font-weight="bold">Total: ₹23,23,391</text>

    <!-- Right Side Cards -->
    <rect x="390" y="130" width="330" height="160" rx="8" fill="#120a22" stroke="#4a2a82" stroke-width="1"/>
    <text x="410" y="165" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">🔊 Web Speech API Soundbox</text>
    <text x="410" y="195" fill="#b39ddb" font-family="sans-serif" font-size="12">Real-time payment audio notifications in Hindi, English, and regional languages.</text>
    <rect x="410" y="235" width="290" height="36" rx="4" fill="#673ab7"/>
    <text x="480" y="258" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">TEST AUDIO FEEDBACK</text>

    <rect x="390" y="310" width="330" height="170" rx="8" fill="#120a22" stroke="#4a2a82" stroke-width="1"/>
    <text x="410" y="345" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">📱 Responsive Phone Simulator</text>
    <text x="410" y="375" fill="#b39ddb" font-family="sans-serif" font-size="12">Interactive desktop toggle allowing full mobile app navigation inside desktop browser.</text>
  </g>
</svg>
