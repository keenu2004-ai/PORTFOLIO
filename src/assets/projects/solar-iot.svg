<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <!-- Dark Solar Cyber Background -->
  <rect width="1200" height="675" fill="#0b0a07"/>
  <rect width="1200" height="675" fill="none" stroke="#ff9800" stroke-width="2" opacity="0.4"/>
  
  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#18140c" stroke="#2e2416" stroke-width="1"/>
  <text x="50" y="44" fill="#ff9800" font-family="'Poppins', sans-serif" font-size="22" font-weight="900" letter-spacing="1">SOLAR PV DEFECT MONITORING SYSTEM</text>
  <rect x="420" y="24" width="140" height="24" rx="4" fill="#ff9800" fill-opacity="0.2"/>
  <text x="430" y="40" fill="#ff9800" font-family="monospace" font-size="11" font-weight="bold">ESP8266 + DHT11</text>
  <text x="1000" y="42" fill="#00f0ff" font-family="monospace" font-size="12">● LIVE SENSOR TELEMETRY</text>

  <!-- Left: Circuit Diagram Mockup -->
  <g transform="translate(50, 100)">
    <rect x="0" y="0" width="480" height="530" rx="10" fill="#14100a" stroke="#2e2416" stroke-width="1"/>
    <text x="30" y="40" fill="#ff9800" font-family="monospace" font-size="14" letter-spacing="2">HARDWARE &amp; SENSOR SCHEMATIC</text>
    
    <!-- Microcontroller Box -->
    <rect x="170" y="80" width="140" height="220" rx="6" fill="#1e180f" stroke="#ff9800" stroke-width="2"/>
    <text x="185" y="110" fill="#ff9800" font-family="monospace" font-size="14" font-weight="bold">ESP8266</text>
    <text x="185" y="128" fill="#8b949e" font-family="monospace" font-size="10">NodeMCU V3</text>

    <!-- Pins -->
    <circle cx="170" cy="160" r="4" fill="#00f0ff"/>
    <text x="140" y="164" fill="#00f0ff" font-family="monospace" font-size="10">A0</text>
    
    <circle cx="170" cy="190" r="4" fill="#3fb950"/>
    <text x="140" y="194" fill="#3fb950" font-family="monospace" font-size="10">D4</text>

    <circle cx="310" cy="160" r="4" fill="#ff9800"/>
    <text x="320" y="164" fill="#ff9800" font-family="monospace" font-size="10">VCC (3.3V)</text>

    <circle cx="310" cy="190" r="4" fill="#ffffff"/>
    <text x="320" y="194" fill="#ffffff" font-family="monospace" font-size="10">GND</text>

    <!-- Solar Panel Module -->
    <rect x="30" y="340" width="180" height="150" rx="6" fill="#0d1b2a" stroke="#00f0ff" stroke-width="1"/>
    <text x="45" y="370" fill="#00f0ff" font-family="sans-serif" font-size="13" font-weight="bold">☀️ Solar PV Panel</text>
    <line x1="30" y1="390" x2="210" y2="390" stroke="#00f0ff" stroke-opacity="0.3"/>
    <line x1="30" y1="420" x2="210" y2="420" stroke="#00f0ff" stroke-opacity="0.3"/>
    <line x1="120" y1="340" x2="120" y2="490" stroke="#00f0ff" stroke-opacity="0.3"/>
    <text x="45" y="465" fill="#3fb950" font-family="monospace" font-size="11">Analog Sensing: OK</text>

    <!-- DHT11 Sensor -->
    <rect x="270" y="340" width="180" height="150" rx="6" fill="#1b2a1a" stroke="#3fb950" stroke-width="1"/>
    <text x="285" y="370" fill="#3fb950" font-family="sans-serif" font-size="13" font-weight="bold">🌡️ DHT11 Sensor</text>
    <text x="285" y="410" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">34.2°C</text>
    <text x="285" y="440" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">58% RH</text>
    <text x="285" y="465" fill="#3fb950" font-family="monospace" font-size="11">Thermal Normal</text>
  </g>

  <!-- Right: IoT Dashboard Live Telemetry -->
  <g transform="translate(560, 100)">
    <rect x="0" y="0" width="590" height="530" rx="10" fill="#14100a" stroke="#2e2416" stroke-width="1"/>
    <text x="30" y="40" fill="#ff9800" font-family="monospace" font-size="14" letter-spacing="2">REAL-TIME THRESHOLD LOGIC DASHBOARD</text>

    <!-- Telemetry Cards -->
    <g transform="translate(30, 60)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="160" height="100" rx="6" fill="#1e180f" stroke="#ff9800"/>
      <text x="15" y="30" fill="#8b949e" font-family="sans-serif" font-size="11">Panel Voltage</text>
      <text x="15" y="65" fill="#ff9800" font-family="monospace" font-size="28" font-weight="bold">18.4V</text>
      <text x="15" y="85" fill="#3fb950" font-family="sans-serif" font-size="10">✓ Nominal Range</text>

      <!-- Box 2 -->
      <rect x="180" y="0" width="160" height="100" rx="6" fill="#1e180f" stroke="#00f0ff"/>
      <text x="195" y="30" fill="#8b949e" font-family="sans-serif" font-size="11">Current Output</text>
      <text x="195" y="65" fill="#00f0ff" font-family="monospace" font-size="28" font-weight="bold">4.2A</text>
      <text x="195" y="85" fill="#3fb950" font-family="sans-serif" font-size="10">✓ Peak Generation</text>

      <!-- Box 3 -->
      <rect x="360" y="0" width="170" height="100" rx="6" fill="#1e180f" stroke="#3fb950"/>
      <text x="375" y="30" fill="#8b949e" font-family="sans-serif" font-size="11">Defect Risk Index</text>
      <text x="375" y="65" fill="#3fb950" font-family="monospace" font-size="28" font-weight="bold">LOW</text>
      <text x="375" y="85" fill="#3fb950" font-family="sans-serif" font-size="10">No Dust/Fault Detected</text>
    </g>

    <!-- Graph Mockup -->
    <g transform="translate(30, 190)">
      <rect x="0" y="0" width="530" height="300" rx="8" fill="#0c0906" stroke="#2e2416"/>
      <text x="20" y="30" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Voltage &amp; Current Sensor Logs (Last 24 Hours)</text>
      
      <!-- Graph Lines -->
      <path d="M 20 220 Q 100 150 180 170 T 340 100 T 510 120" fill="none" stroke="#ff9800" stroke-width="3"/>
      <path d="M 20 240 Q 100 190 180 200 T 340 140 T 510 160" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="4"/>
      
      <text x="20" y="275" fill="#8b949e" font-family="monospace" font-size="10">00:00</text>
      <text x="140" y="275" fill="#8b949e" font-family="monospace" font-size="10">06:00</text>
      <text x="260" y="275" fill="#8b949e" font-family="monospace" font-size="10">12:00</text>
      <text x="380" y="275" fill="#8b949e" font-family="monospace" font-size="10">18:00</text>
      <text x="480" y="275" fill="#8b949e" font-family="monospace" font-size="10">23:59</text>
    </g>
  </g>
</svg>
